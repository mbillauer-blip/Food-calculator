<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Party Food Calculator</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // GitHub Pages serves this file for any unknown path (e.g. a direct
      // link to /Food-calculator/blog/some-post). It re-encodes that path
      // into a query string and redirects to index.html, which decodes it
      // back on load (see the matching script in index.html) so the React
      // router ends up on the right route.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
